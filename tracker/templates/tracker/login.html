{% extends "tracker/base.html" %}

{% block content %}

<div style="height: 80px;"></div>

<div class="card primary-card">
    <div class="brand">Fortnight Tracker</div>
    <p class="muted">
        Track your rolling 48-hour work limit.
    </p>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="button">
            Login
        </button>
    </form>
</div>

{% endblock %}
