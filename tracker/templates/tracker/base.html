<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fortnight Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background: #f4f7fb;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: clamp(22px, 7vw, 32px);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .logout {
            color: #667085;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .card {
            background: white;
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 14px 34px rgba(16, 24, 40, 0.08);
            margin-bottom: 16px;
        }

        .primary-card {
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            overflow: hidden;
        }

        .muted {
            color: #667085;
            font-size: 14px;
            line-height: 1.4;
        }

        .primary-card .muted {
            color: rgba(255, 255, 255, 0.78);
        }

        .big-number {
            font-size: clamp(42px, 15vw, 72px);
            font-weight: 950;
            margin: 8px 0;
            letter-spacing: -0.06em;
            line-height: 0.95;
        }

        .summary-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        .progress-ring {
            width: 104px;
            height: 104px;
            border-radius: 999px;
            background: conic-gradient(
                white var(--percent),
                rgba(255,255,255,0.18) 0
            );
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .progress-ring-inner {
            width: 78px;
            height: 78px;
            border-radius: 999px;
            background: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .button {
            display: flex;
            width: 100%;
            min-height: 58px;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 850;
            border: none;
            cursor: pointer;
            font-size: 17px;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .secondary-button {
            background: #eef4ff;
            color: #2563eb;
            box-shadow: none;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 1px solid #d0d5dd;
            border-radius: 16px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 8px;
            background: white;
        }

        label {
            font-weight: 800;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .day-card {
            background: #f8fafc;
            border-radius: 18px;
            padding: 14px 12px;
            min-height: 92px;
            border: 1px solid #eef2f6;
        }

        .day-card.worked {
            background: #eef4ff;
            border-color: #bfdbfe;
        }

        .day-name {
            font-size: 12px;
            font-weight: 800;
            color: #667085;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .day-number {
            font-size: 26px;
            font-weight: 950;
            margin-top: 4px;
            letter-spacing: -0.04em;
        }

        .day-hours {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 900;
            color: #2563eb;
        }

        .day-empty {
            margin-top: 8px;
            font-size: 13px;
            color: #98a2b3;
            font-weight: 700;
        }

        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        @media (min-width: 430px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }

            .day-card {
                text-align: center;
                padding: 12px 8px;
                min-height: 86px;
            }
        }

        @media (max-width: 360px) {
            .summary-layout {
                align-items: flex-start;
            }

            .progress-ring {
                width: 86px;
                height: 86px;
            }

            .progress-ring-inner {
                width: 64px;
                height: 64px;
                font-size: 15px;
            }

            .card {
                padding: 18px;
                border-radius: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
