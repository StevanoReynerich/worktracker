<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fortnight Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background: #f4f7fb;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: clamp(22px, 7vw, 32px);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .logout {
            color: #667085;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .card {
            background: white;
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 14px 34px rgba(16, 24, 40, 0.08);
            margin-bottom: 16px;
        }

        .primary-card {
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            overflow: hidden;
        }

        .muted {
            color: #667085;
            font-size: 14px;
            line-height: 1.4;
        }

        .primary-card .muted {
            color: rgba(255, 255, 255, 0.78);
        }

        .big-number {
            font-size: clamp(42px, 15vw, 72px);
            font-weight: 950;
            margin: 8px 0;
            letter-spacing: -0.06em;
            line-height: 0.95;
        }

        .summary-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        .progress-ring {
            width: 104px;
            height: 104px;
            border-radius: 999px;
            background: conic-gradient(
                white var(--percent),
                rgba(255,255,255,0.18) 0
            );
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .progress-ring-inner {
            width: 78px;
            height: 78px;
            border-radius: 999px;
            background: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .button {
            display: flex;
            width: 100%;
            min-height: 58px;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 850;
            border: none;
            cursor: pointer;
            font-size: 17px;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .secondary-button {
            background: #eef4ff;
            color: #2563eb;
            box-shadow: none;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 1px solid #d0d5dd;
            border-radius: 16px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 8px;
            background: white;
        }

        label {
            font-weight: 800;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .day-card {
            background: #f8fafc;
            border-radius: 18px;
            padding: 14px 12px;
            min-height: 92px;
            border: 1px solid #eef2f6;
        }

        .day-card.worked {
            background: #eef4ff;
            border-color: #bfdbfe;
        }

        .day-name {
            font-size: 12px;
            font-weight: 800;
            color: #667085;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .day-number {
            font-size: 26px;
            font-weight: 950;
            margin-top: 4px;
            letter-spacing: -0.04em;
        }

        .day-hours {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 900;
            color: #2563eb;
        }

        .day-empty {
            margin-top: 8px;
            font-size: 13px;
            color: #98a2b3;
            font-weight: 700;
        }

        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        @media (min-width: 430px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }

            .day-card {
                text-align: center;
                padding: 12px 8px;
                min-height: 86px;
            }
        }

        @media (max-width: 360px) {
            .summary-layout {
                align-items: flex-start;
            }

            .progress-ring {
                width: 86px;
                height: 86px;
            }

            .progress-ring-inner {
                width: 64px;
                height: 64px;
                font-size: 15px;
            }

            .card {
                padding: 18px;
                border-radius: 22px;
            }

            .day-card {
                appearance: none;
                border: 1px solid #eef2f6;
                cursor: pointer;
                font-family: inherit;
                color: inherit;
            }

            .sheet-overlay {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.45);
                z-index: 100;
                display: none;
                align-items: flex-end;
            }

            .sheet-overlay.active {
                display: flex;
            }

            .bottom-sheet {
                width: 100%;
                max-width: 480px;
                margin: 0 auto;
                background: white;
                border-radius: 28px 28px 0 0;
                padding: 12px 18px calc(22px + env(safe-area-inset-bottom));
                box-shadow: 0 -20px 50px rgba(15, 23, 42, 0.2);
                animation: sheetUp 0.22s ease-out;
                max-height: 78vh;
                overflow-y: auto;
            }

            @keyframes sheetUp {
                from {
                    transform: translateY(100%);
                }
                to {
                    transform: translateY(0);
                }
            }

            .sheet-handle {
                width: 46px;
                height: 5px;
                background: #d0d5dd;
                border-radius: 999px;
                margin: 4px auto 18px;
            }

            .sheet-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 16px;
            }

            .sheet-title {
                font-size: 22px;
                font-weight: 900;
                letter-spacing: -0.04em;
            }

            .icon-button {
                width: 38px;
                height: 38px;
                border-radius: 999px;
                border: none;
                background: #f2f4f7;
                font-size: 18px;
                cursor: pointer;
            }

            .entry-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .entry-card {
                display: flex;
                justify-content: space-between;
                gap: 14px;
                background: #f8fafc;
                border: 1px solid #eef2f6;
                border-radius: 18px;
                padding: 14px;
            }

            .entry-time {
                font-size: 18px;
                font-weight: 900;
            }

            .entry-actions {
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: flex-end;
            }

            .small-action {
                border: none;
                background: #eef4ff;
                color: #2563eb;
                padding: 8px 12px;
                border-radius: 999px;
                font-size: 13px;
                font-weight: 800;
                text-decoration: none;
                cursor: pointer;
            }

            .small-action.danger {
                background: #fee2e2;
                color: #dc2626;
            }

            .empty-state {
                padding: 24px;
                background: #f8fafc;
                border-radius: 18px;
                color: #667085;
                text-align: center;
                font-weight: 700;
            }
        }
    </style>
</head>
<body>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
